<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | RealEstate Luxury Living</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <header>
        <a href="index.html" class="logo">
            <i class="fas fa-city"></i>
            <span class="brand-real">real</span><span class="brand-estate">Estate</span>
        </a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <a href="services.html">Services</a>
            <a href="agent.html">Agents</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="index.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div style="width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 50%; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-lock" style="font-size: 1.5rem; color: var(--primary);"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to access your saved properties and inquiries.</p>
            </div>

            <form class="auth-form" onsubmit="return sub(event)">
                <div class="form-group">
                    <label for="uid">UserID or Email</label>
                    <input type="text" id="uid" class="form-control" placeholder="e.g. JohnDoe" required>
                </div>

                <div class="form-group">
                    <label for="pass">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="pass" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('pass', this)">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-muted);">
                        <input type="checkbox" checked style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary);" onclick="alert('Password reset link sent to registered email.');">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div class="auth-footer">
                    Don't have an account? <a href="login.html">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <script src="login2.js"></script>
    <script>
        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
